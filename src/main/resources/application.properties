spring.application.name=Authentication_sys
server.port=8080

# Load local secrets (git-ignored, never committed)
spring.config.import=optional:classpath:application-local.properties

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/authentication_sys?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# AWS
spring.cloud.aws.region.static=us-east-1

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.expiration=600000

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Logging
logging.file.name=C:/Users/lokeshwarl/Desktop/Authentication_sys-main/Authentication_sys-main/logs/app.log
logging.level.root=INFO
logging.level.com.example.Authentication_sys=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.application.name=Authentication_sys
server.port=8080

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/authentication_sys?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# AWS
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.cloud.aws.region.static=us-east-1

# SNS Topic
aws.sns.topicArn=${AWS_SNS_TOPIC_ARN}

# SQS Queues
aws.sqs.dbUpdateQueueUrl=${AWS_SQS_DB_UPDATE_QUEUE_URL}
aws.sqs.emailQueueUrl=${AWS_SQS_EMAIL_QUEUE_URL}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=600000

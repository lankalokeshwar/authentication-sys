<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <div class="card">
    <h1>Reset Password</h1>

    <div class="alert" id="alert"></div>

    <!-- Step 1: Enter email -->
    <div class="step active" id="step1">
      <p style="color:#a0bfcf; font-size:0.9rem; text-align:center; margin-bottom:20px;">
        Enter your email and we'll send you an OTP.
      </p>
      <form id="emailForm" novalidate>
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required autocomplete="email" />
        </div>
        <button class="btn btn-primary" type="submit" id="sendOtpBtn">Send OTP</button>
      </form>
    </div>

    <!-- Step 2: Enter OTP + new password -->
    <div class="step" id="step2">
      <p style="color:#a0bfcf; font-size:0.9rem; text-align:center; margin-bottom:20px;">
        Enter the OTP sent to your email and choose a new password.
      </p>
      <form id="resetForm" novalidate>
        <div class="form-group">
          <input type="text" id="otp" placeholder="Enter OTP" required maxlength="6" />
        </div>
        <div class="form-group">
          <input type="password" id="newPassword" placeholder="New Password (min 8 chars)" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <input type="password" id="confirmPassword" placeholder="Confirm New Password" required autocomplete="new-password" />
        </div>
        <button class="btn btn-primary" type="submit" id="resetBtn">Reset Password</button>
        <button class="btn btn-secondary" type="button" id="backBtn">Back</button>
      </form>
    </div>

    <div class="link-row">
      <a href="/index.html">Back to Login</a>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    let userEmail = '';

    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const email = document.getElementById('email').value.trim();
      if (!email) { showAlert('alert', 'Please enter your email.'); return; }

      setLoading('sendOtpBtn', true, 'Send OTP');

      try {
        const { status, data } = await apiPost('/auth/forgot-password', { email });

        if (data.success) {
          userEmail = email;
          document.getElementById('step1').classList.remove('active');
          document.getElementById('step2').classList.add('active');
          showAlert('alert', data.message, 'success');
        } else {
          showAlert('alert', data.message || 'Failed to send OTP.');
        }
      } catch {
        showAlert('alert', 'Could not connect to server.');
      } finally {
        setLoading('sendOtpBtn', false, 'Send OTP');
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const otp             = document.getElementById('otp').value.trim();
      const newPassword     = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!otp || !newPassword || !confirmPassword) {
        showAlert('alert', 'Please fill in all fields.'); return;
      }
      if (newPassword.length < 8) {
        showAlert('alert', 'Password must be at least 8 characters.'); return;
      }
      if (newPassword !== confirmPassword) {
        showAlert('alert', 'Passwords do not match.'); return;
      }

      setLoading('resetBtn', true, 'Reset Password');

      try {
        const { status, data } = await apiPost('/auth/reset-password', {
          email: userEmail, otp, newPassword
        });

        if (data.success) {
          showAlert('alert', 'Password reset! Redirecting to login…', 'success');
          setTimeout(() => window.location.href = '/index.html', 2000);
        } else {
          showAlert('alert', data.message || 'Reset failed.');
        }
      } catch {
        showAlert('alert', 'Could not connect to server.');
      } finally {
        setLoading('resetBtn', false, 'Reset Password');
      }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      hideAlert('alert');
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
    });
  </script>
</body>
</html>

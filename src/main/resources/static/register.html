<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <div class="card">
    <h1>Register</h1>

    <div class="alert" id="alert"></div>

    <!-- Step 1: Registration form -->
    <div class="step active" id="step1">
      <form id="registerForm" novalidate>
        <div class="row">
          <div class="form-group">
            <input type="text" id="firstName" placeholder="First Name" required />
          </div>
          <div class="form-group">
            <input type="text" id="lastName" placeholder="Last Name" required />
          </div>
        </div>
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <input type="tel" id="phoneNumber" placeholder="Phone Number (10 digits)" required />
        </div>
        <div class="form-group">
          <input type="password" id="password" placeholder="Password (min 8 chars)" required autocomplete="new-password" />
        </div>
        <div class="row">
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dateOfBirth" />
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select id="gender">
              <option value="">Select</option>
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary" type="submit" id="registerBtn">Create Account</button>
      </form>
      <div class="link-row">
        Already have an account? <a href="/index.html">Login</a>
      </div>
    </div>

    <!-- Step 2: OTP verification -->
    <div class="step" id="step2">
      <p style="color:#a0bfcf; font-size:0.9rem; text-align:center; margin-bottom:20px;">
        An OTP has been sent to <strong id="sentToEmail" style="color:#fff;"></strong>.<br/>
        Enter it below to verify your email.
      </p>
      <form id="otpForm" novalidate>
        <div class="form-group">
          <input type="text" id="otp" placeholder="Enter OTP" required maxlength="6"
                 style="letter-spacing:0.3em; font-size:1.2rem; text-align:center;" />
        </div>
        <button class="btn btn-primary" type="submit" id="verifyBtn">Verify Email</button>
      </form>
      <div class="link-row">
        Didn't receive it? <a href="#" id="resendLink">Resend OTP</a>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    redirectIfLoggedIn();

    let registeredEmail = '';

    /* ── Step 1: Register ───────────────────────────────────────── */
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const firstName   = document.getElementById('firstName').value.trim();
      const lastName    = document.getElementById('lastName').value.trim();
      const email       = document.getElementById('email').value.trim();
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const password    = document.getElementById('password').value;
      const dateOfBirth = document.getElementById('dateOfBirth').value;
      const gender      = document.getElementById('gender').value;

      if (!firstName || !lastName || !email || !phoneNumber || !password) {
        showAlert('alert', 'Please fill in all required fields.'); return;
      }
      if (!/^[6-9]\d{9}$/.test(phoneNumber)) {
        showAlert('alert', 'Phone number must be 10 digits starting with 6–9.'); return;
      }
      if (password.length < 8) {
        showAlert('alert', 'Password must be at least 8 characters.'); return;
      }

      setLoading('registerBtn', true, 'Create Account');
      try {
        const { status, data } = await apiPost('/auth/register', {
          firstName, lastName, email, phoneNumber, password,
          dateOfBirth: dateOfBirth || null,
          gender: gender || null
        });

        if (status === 201 && data.success) {
          registeredEmail = email;
          document.getElementById('sentToEmail').textContent = email;
          document.getElementById('step1').classList.remove('active');
          document.getElementById('step2').classList.add('active');
          showAlert('alert', data.message, 'success');
        } else {
          showAlert('alert', data.message || 'Registration failed.');
        }
      } catch {
        showAlert('alert', 'Could not connect to server. Please try again.');
      } finally {
        setLoading('registerBtn', false, 'Create Account');
      }
    });

    /* ── Step 2: Verify OTP ─────────────────────────────────────── */
    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const otp = document.getElementById('otp').value.trim();
      if (!otp) { showAlert('alert', 'Please enter the OTP.'); return; }

      setLoading('verifyBtn', true, 'Verify Email');
      try {
        const { status, data } = await apiPost('/auth/verify-email', { email: registeredEmail, otp });

        if (data.success) {
          Auth.save(data.token);
          Auth.saveUser(data.user);
          showAlert('alert', 'Email verified! Redirecting…', 'success');
          setTimeout(() => window.location.href = '/dashboard.html', 1500);
        } else {
          showAlert('alert', data.message || 'Invalid OTP.');
        }
      } catch {
        showAlert('alert', 'Could not connect to server.');
      } finally {
        setLoading('verifyBtn', false, 'Verify Email');
      }
    });

    /* ── Resend OTP ─────────────────────────────────────────────── */
    document.getElementById('resendLink').addEventListener('click', async (e) => {
      e.preventDefault();
      hideAlert('alert');
      try {
        const { data } = await apiPost('/auth/resend-verification', { email: registeredEmail });
        showAlert('alert', data.message, 'success');
      } catch {
        showAlert('alert', 'Could not resend OTP.');
      }
    });
  </script>
</body>
</html>

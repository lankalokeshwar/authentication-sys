<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <div class="card">
    <h1>Login</h1>

    <div class="alert" id="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <input type="email" id="email" placeholder="Email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Login</button>
    </form>

    <div class="link-row">
      <a href="/forgot-password.html">Forgot password?</a>
    </div>
    <div class="link-row">
      Don't have an account? <a href="/register.html">Register</a>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('alert', 'Please fill in all fields.');
        return;
      }

      setLoading('loginBtn', true, 'Login');

      try {
        const { status, data } = await apiPost('/auth/login', { email, password });

        if (status === 200 && data.success) {
          Auth.save(data.token);
          Auth.saveUser(data.user);
          window.location.href = data.user.role === 'ADMIN' ? '/admin.html' : '/dashboard.html';
        } else if (status === 403 && data.message && data.message.includes('verify')) {
          showAlert('alert', data.message + ' <a href="/register.html" style="color:#64b5f6;">Verify now</a>');
          document.getElementById('alert').innerHTML = data.message + ' <a href="/register.html" style="color:#64b5f6;">Verify here</a>';
          document.getElementById('alert').className = 'alert alert-error show';
        } else {
          showAlert('alert', data.message || 'Invalid credentials.');
        }
      } catch {
        showAlert('alert', 'Could not connect to server. Please try again.');
      } finally {
        setLoading('loginBtn', false, 'Login');
      }
    });
  </script>
</body>
</html>
